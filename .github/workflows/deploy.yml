name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd ~/portal
            git fetch origin
            BRANCH="$(git rev-parse --abbrev-ref HEAD)"
            if [ "$BRANCH" = "HEAD" ] || [ -z "$BRANCH" ]; then
              BRANCH="main"
              echo "==> Detached HEAD detected; deploying origin/main"
              git checkout -B main "origin/main"
            fi
            echo "==> Syncing tracked files to origin/${BRANCH}"
            echo "    Local edits to tracked files are discarded so deploy can proceed."
            echo "    Untracked files such as .env and uploads are kept."
            git status --porcelain || true
            git reset --hard "origin/${BRANCH}"
            # Leftover untracked migrations abort `artisan migrate` when they collide
            # with tables already created by the tracked migration history.
            if [ -n "$(git ls-files --others --exclude-standard -- database/migrations)" ]; then
              echo "==> Removing untracked migration leftovers..."
              git ls-files --others --exclude-standard -- database/migrations | while IFS= read -r stray; do
                echo "    rm $stray"
                rm -f -- "$stray"
              done
            fi
            bash ./deploy.sh
